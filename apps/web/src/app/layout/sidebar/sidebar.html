<aside class="sidebar">
  <header class="brand">
    <img
      class="brand__logo"
      src="/piximind-logo.png"
      alt="Logo Piximind"
    />

    <div class="brand__identity">
      <strong>PIXIMIND</strong>
      <span>Deployment Platform</span>
    </div>
  </header>

  <nav class="navigation" aria-label="Navigation principale">
    <p class="navigation__title">Espace de travail</p>

    <a
      class="navigation-item"
      routerLink="/dashboard"
      routerLinkActive="navigation-item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="navigation-item__icon">⌂</span>
      <span class="navigation-item__label">Vue générale</span>
    </a>

    <a
      class="navigation-item"
      routerLink="/projects"
      routerLinkActive="navigation-item--active"
    >
      <span class="navigation-item__icon">▣</span>
      <span class="navigation-item__label">Projets</span>
    </a>

    <a
      class="navigation-item"
      routerLink="/deployments"
      routerLinkActive="navigation-item--active"
    >
      <span class="navigation-item__icon">⇄</span>
      <span class="navigation-item__label">Déploiements</span>
    </a>

    <a
      class="navigation-item"
      routerLink="/performance"
      routerLinkActive="navigation-item--active"
    >
      <span class="navigation-item__icon">⌁</span>
      <span class="navigation-item__label">Performance</span>
    </a>

    <a
      class="navigation-item"
      routerLink="/infrastructure"
      routerLinkActive="navigation-item--active"
    >
      <span class="navigation-item__icon">◎</span>
      <span class="navigation-item__label">Infrastructure</span>
    </a>

    <a
      class="navigation-item"
      routerLink="/integrations"
      routerLinkActive="navigation-item--active"
    >
      <span class="navigation-item__icon">↗</span>
      <span class="navigation-item__label">Intégrations</span>
    </a>

    <a
      class="navigation-item"
      routerLink="/settings"
      routerLinkActive="navigation-item--active"
    >
      <span class="navigation-item__icon">⚙</span>
      <span class="navigation-item__label">Paramètres</span>
    </a>

    @if (auth.isAdmin()) {
      <p class="navigation__title">Administration</p>

      <a
        class="navigation-item"
        routerLink="/admin"
        routerLinkActive="navigation-item--active"
      >
        <span class="navigation-item__icon">♙</span>
        <span class="navigation-item__label">Administration</span>
      </a>
    }
  </nav>

  <footer class="sidebar-footer">
    <div class="user-avatar">{{ initials }}</div>
    <div class="user-information">
      <strong>{{ displayName }}</strong>
      <span>{{ roleLabel }}</span>
    </div>
    <button
      class="logout-button"
      type="button"
      title="Se déconnecter"
      aria-label="Se déconnecter"
      (click)="logout()"
    >
      →
    </button>
  </footer>
</aside>
